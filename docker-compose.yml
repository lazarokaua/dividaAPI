services:
  db:
    image: postgres:18-alpine
    container_name: divida_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata: